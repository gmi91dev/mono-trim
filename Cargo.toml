[package]
name = "mono-trim"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mtrim"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
insta = { version = "1.49.0", features = ["filters"] }
