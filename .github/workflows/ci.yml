name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI 中只比对快照，绝不自动更新
  INSTA_UPDATE: "no"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Verify PowerShell scripts are ASCII without BOM
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/install.ps1 scripts/uninstall.ps1; do
            # `irm | iex` 会把 BOM 当成脚本内容，必须无 BOM
            if head -c 3 "$f" | od -An -tx1 | grep -q "ef bb bf"; then
              echo "::error::$f 不能以 UTF-8 BOM 开头（irm | iex 会解析失败）"
              exit 1
            fi
            # Windows PowerShell 5.1 读无 BOM 文件时按 ANSI 处理，内容必须是纯 ASCII
            if LC_ALL=C grep -n '[^ -~]' "$f"; then
              echo "::error::$f 必须是纯 ASCII（不支持中文/emoji）"
              exit 1
            fi
          done

      - name: Lint install.sh
        shell: bash
        run: bash -n scripts/install.sh

      - name: Lint & smoke test install.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errors)
          if ($errors) { $errors | Out-String | Write-Error; exit 1 }
          ./scripts/install.ps1 -DryRun -Dir "$env:RUNNER_TEMP\mtrim" -NoPath
          ./scripts/uninstall.ps1 -DryRun -Dir "$env:RUNNER_TEMP\mtrim"

      - name: Smoke test install.sh (macOS sh/bash/zsh)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sh -n scripts/install.sh && bash -n scripts/install.sh && zsh -n scripts/install.sh
          sh -n scripts/uninstall.sh
          sh -n scripts/e2e-install.sh
          sh scripts/install.sh --dry-run
          bash scripts/install.sh --dry-run
          zsh scripts/install.sh --dry-run

      - name: Smoke test install.sh (Linux sh/bash)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sh -n scripts/install.sh && bash -n scripts/install.sh
          sh -n scripts/uninstall.sh
          sh -n scripts/e2e-install.sh
          sh scripts/install.sh --dry-run
          bash scripts/install.sh --dry-run

      - name: Test
        run: cargo test --all-targets

      - name: Build (release)
        run: cargo build --release

      - name: Installer end-to-end (sh/bash)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/e2e-install.sh sh bash

      - name: Installer end-to-end (sh/bash/zsh)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/e2e-install.sh sh bash zsh

      - name: Installer end-to-end (cmd + PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/e2e-install.ps1
